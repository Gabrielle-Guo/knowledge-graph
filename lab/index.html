<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Equilibrium Case Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="css">
/* Layout: case list on the left; each case runs as a left-to-right chain of stages (2D prototype → first-step transformation → In-Between State → Materialize → Built case), each stage holding a form and a force diagram on paper-white boards; a full-screen drawing board opens for any diagram; a compare view lines the cases up to find rules. Diagram boards stay paper-white in both themes because they are print figures. */
:root {
  --bg: #e9ecf0;
  --surface: #ffffff;
  --surface-2: #f3f5f8;
  --ink: #1a1e24;
  --ink-2: #5a6370;
  --line: #d4d9e0;
  --accent: #5a44c8;
  --accent-soft: #ece9fb;
  --warn: #b86a12;
  --ok: #1e7a4c;
  --danger: #b4232c;
  --comp: #2f6fd6;
  --tens: #c8323a;
  --load: #22a05a;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #121519; --surface: #1b1f25; --surface-2: #242a32; --ink: #e5e8ec; --ink-2: #9aa3ae; --line: #313840; --accent: #a594ff; --accent-soft: #2a2647; --warn: #f0a24e; --ok: #5fd39a; --danger: #ff7c83; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #121519; --surface: #1b1f25; --surface-2: #242a32; --ink: #e5e8ec; --ink-2: #9aa3ae; --line: #313840; --accent: #a594ff; --accent-soft: #2a2647; --warn: #f0a24e; --ok: #5fd39a; --danger: #ff7c83; color-scheme: dark; }
[hidden] { display: none !important; }
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; }
#root { height: 100%; display: flex; flex-direction: column; }
button, .btn { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; min-height: 30px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.2; white-space: nowrap; }
button:hover, .btn:hover { border-color: var(--ink-2); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .btn:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
button.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); font-weight: 600; }
button.danger { color: var(--danger); }
button.quiet { background: transparent; border-color: transparent; color: var(--ink-2); }
button.quiet:hover { border-color: var(--line); color: var(--ink); }
button:disabled { opacity: .45; cursor: not-allowed; }
input[type="text"], input[type="number"], select, textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0; }
textarea { resize: vertical; line-height: 1.4; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface-2); }
.mono { font-family: var(--f-mono); }
.note { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; margin: 0; }
.kicker { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); font-weight: 500; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-2); min-width: 0; }

/* top bar */
.bar { background: var(--surface); border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.brand { font-weight: 600; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
.brand svg { flex: none; }
.tabs { display: flex; gap: 4px; }
.grp { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.status { margin-left: auto; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.status.dirty::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }

/* main split */
main { flex: 1; min-height: 0; display: grid; grid-template-columns: 250px minmax(0, 1fr); }
.side { background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 12px 20px max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; }
.side h2 { font-size: 12px; margin: 0 4px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); font-weight: 600; display: flex; justify-content: space-between; }
.clist { display: flex; flex-direction: column; gap: 4px; }
.citem { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; padding: 6px; border-radius: 8px; border: 1px solid transparent; background: transparent; white-space: normal; justify-content: stretch; min-height: 0; }
.citem:hover { background: var(--surface-2); border-color: var(--line); }
.citem[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
.citem .mini { width: 58px; height: 44px; background: #fff; border: 1px solid var(--line); border-radius: 5px; display: block; }
.citem b { display: block; font-size: 13.5px; font-weight: 600; overflow-wrap: anywhere; }
.citem small { display: block; color: var(--ink-2); font-size: 12px; }
.dots { display: inline-flex; gap: 3px; margin-top: 3px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; border: 1px solid var(--ink-2); display: inline-block; }
.dots i.on { background: var(--ink-2); }
.dots i.ok { background: var(--ok); border-color: var(--ok); }
.dots i.bad { background: var(--warn); border-color: var(--warn); }
.view { min-width: 0; overflow-y: auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) 40px 20px; display: flex; flex-direction: column; gap: 18px; }

/* case header */
.chead { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, .6fr) minmax(0, 1fr) minmax(0, 1.2fr) auto; gap: 10px; align-items: end; }
.chead .name input { font-size: 20px; font-weight: 600; padding: 6px 8px; }
.pathline { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--ink-2); }
.pathline input { max-width: 560px; }

/* the chain */
.chain-wrap { overflow-x: auto; padding-bottom: 6px; }
.chain { display: grid; grid-template-columns: minmax(205px, 1fr) 104px minmax(205px, 1fr) 104px minmax(205px, 1fr) 104px minmax(205px, 1fr); align-items: stretch; min-width: 1150px; }
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.stage .shead { display: flex; flex-direction: column; gap: 4px; }
.stage .shead input { font-weight: 600; font-size: 14.5px; }
.tiles { display: flex; flex-direction: column; gap: 8px; }
.tile { position: relative; border: 1px solid var(--line); border-radius: 8px; background: #ffffff; aspect-ratio: 4 / 3; overflow: hidden; max-width: 100%; }
.tile > svg, .tile > img { width: 100%; height: 100%; display: block; object-fit: cover; }
.tile .tlabel { position: absolute; left: 8px; top: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: #5a6370; font-weight: 600; background: rgba(255, 255, 255, .85); padding: 1px 5px; border-radius: 4px; pointer-events: none; }
.tile .badge { position: absolute; right: 6px; top: 6px; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; pointer-events: none; }
.badge.ok { background: #e3f4ea; color: #1e7a4c; }
.badge.bad { background: #fbeedd; color: #9a5608; }
.badge.mid { background: #eef0f3; color: #4c5561; }
.tile .open { position: absolute; inset: 0; border: 0; background: transparent; border-radius: 0; cursor: pointer; }
.tile .open:hover { background: rgba(90, 68, 200, .06); }
.tile .empty { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center; padding: 10px; text-align: center; }
.tile .empty p { margin: 0; color: #5a6370; font-size: 12.5px; }
.tile .empty button { background: #f3f5f8; color: #1a1e24; border-color: #d4d9e0; }
.stage textarea { font-size: 13px; }
.link { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0 6px; position: relative; }
.link::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 6px; margin-top: -3px; background: #c4c8ce; border-radius: 3px; z-index: 0; }
.link.mat::before { background: #2a2e33; height: 3px; margin-top: -1.5px; }
.link > * { position: relative; z-index: 1; }
.link textarea { text-align: center; font-family: var(--f-mono); font-size: 12px; line-height: 1.3; padding: 5px 6px; border-radius: 10px; background: #c4c8ce; color: #23272d; border-color: #b3b8bf; resize: none; }
.link textarea::placeholder { color: #5a6370; }
.link .lab { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); background: var(--bg); padding: 0 4px; border-radius: 3px; }
.link .matpill { background: #111; color: #fff; font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.matbox { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.matbox input { font-size: 13px; padding: 5px 7px; }
.intent { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.intent .grid6 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.section-title { font-size: 12px; margin: 0; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* compare */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h2 { font-size: 17px; margin: 0; font-weight: 600; text-wrap: balance; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 860px; font-size: 13px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); font-weight: 600; }
td .cmd { font-family: var(--f-mono); font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.chip.c { color: var(--comp); border-color: color-mix(in srgb, var(--comp) 45%, var(--line)); }
.chip.t { color: var(--tens); border-color: color-mix(in srgb, var(--tens) 45%, var(--line)); }
.cmp-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; }
.heat { display: grid; gap: 3px; font-size: 11.5px; }
.heat .hc { height: 38px; border-radius: 4px; border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; cursor: pointer; padding: 0; min-height: 0; }
.heat .hl { font-size: 11.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; align-self: center; }
.heat .hl.top { writing-mode: vertical-rl; transform: rotate(180deg); align-self: end; justify-self: center; max-height: 120px; }
.heat { max-width: 560px; }
.heat .hc[aria-pressed="true"] { outline: 2px solid var(--accent); }
.rels { display: flex; flex-direction: column; gap: 8px; }
.rel { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.rel .k { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); font-weight: 600; }
.rel p { margin: 3px 0 0; font-size: 13.5px; }
.rules { display: flex; flex-direction: column; gap: 10px; }
.rule { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.rule .top { display: grid; grid-template-columns: minmax(0, 1fr) 150px auto; gap: 8px; align-items: start; }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.toggles button { font-size: 12px; min-height: 26px; padding: 2px 9px; border-radius: 999px; }
.st-holds { color: var(--ok); }
.st-rejected { color: var(--danger); }

/* drawing board */
.ed { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.ed-bar { background: var(--surface); border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.ed-title { font-weight: 600; font-size: 15px; min-width: 0; overflow-wrap: anywhere; }
.ed-title small { display: block; font-weight: 400; color: var(--ink-2); font-size: 12px; }
.ed-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 64px minmax(0, 1fr) 320px; }
.tools { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; padding: 8px 6px; overflow-y: auto; padding-left: max(6px, env(safe-area-inset-left, 0px)); }
.tools button { flex-direction: column; gap: 2px; padding: 6px 2px; font-size: 10.5px; min-height: 48px; width: 100%; }
.tools button svg { width: 22px; height: 22px; }
.board-wrap { position: relative; min-width: 0; min-height: 0; padding: 14px; display: flex; }
#edc { flex: 1; width: 100%; height: 100%; background: #ffffff; border: 1px solid var(--line); border-radius: 8px; touch-action: none; user-select: none; -webkit-user-select: none; }
.ed-hint { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--surface); font-size: 12.5px; padding: 6px 12px; border-radius: 999px; pointer-events: none; max-width: calc(100% - 40px); text-align: center; }
.ed-side { background: var(--surface); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px max(14px, env(safe-area-inset-right, 0px)) 24px 14px; display: flex; flex-direction: column; gap: 16px; }
.ed-side .sec { display: flex; flex-direction: column; gap: 8px; }
.ed-side .sec + .sec { border-top: 1px solid var(--line); padding-top: 14px; }
.ed-side h3 { font-size: 12px; margin: 0; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); font-weight: 600; }
.cmdgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.cmdgrid button { white-space: normal; text-align: left; justify-content: flex-start; font-size: 12.5px; }
.inline { display: grid; grid-template-columns: minmax(0, 1fr) 72px; gap: 6px; align-items: center; }
.result { border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.45; }
.result.ok { background: color-mix(in srgb, var(--ok) 14%, var(--surface)); }
.result.bad { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); }
.result.mid { background: var(--surface-2); }
.result b { display: block; margin-bottom: 2px; }
.flist { font-family: var(--f-mono); font-size: 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; }
.legend-k { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--ink-2); }
.legend-k span { display: inline-flex; align-items: center; gap: 5px; }
.legend-k i { width: 18px; height: 3px; display: inline-block; border-radius: 2px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 9px 16px; border-radius: 8px; font-size: 13.5px; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0, 0, 0, .25); z-index: 50; }

@media (max-width: 900px) {
  html, body, #root { height: auto; }
  main { display: block; }
  .side { border-right: 0; border-bottom: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
  .clist { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
  .citem { min-width: 210px; }
  .view { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
  .chead { grid-template-columns: 1fr 1fr; }
  .chead .name { grid-column: 1 / -1; }
  .chain { display: flex; flex-direction: column; min-width: 0; gap: 0; }
  .link { padding: 10px 0; min-height: 70px; }
  .link::before { left: 50%; right: auto; top: 0; bottom: 0; width: 6px; height: auto; margin: 0 0 0 -3px; }
  .link.mat::before { width: 3px; margin-left: -1.5px; height: auto; }
  .link input { max-width: 220px; }
  .intent .grid6, .cmp-grid { grid-template-columns: 1fr; }
  .rule .top { grid-template-columns: 1fr; }
  .ed { overflow-y: auto; }
  .ed-body { display: flex; flex-direction: column; }
  .tools { flex-direction: row; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; padding: 6px max(10px, env(safe-area-inset-left, 0px)); }
  .tools button { width: 62px; flex: none; }
  .board-wrap { height: 62vh; flex: none; }
  .ed-side { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .status { margin-left: 0; }
}
@media (prefers-reduced-motion: no-preference) { button { transition: border-color .12s, background-color .12s; } }
</style>

<div id="root">
  <header class="bar">
    <span class="brand"><svg width="22" height="18" viewBox="0 0 22 18" aria-hidden="true"><path d="M2 15 L11 3 L20 15" fill="none" stroke="#2f6fd6" stroke-width="2.2" stroke-linejoin="round"/><path d="M2 15 H20" stroke="#c8323a" stroke-width="2"/><path d="M11 0 V6" stroke="#22a05a" stroke-width="1.6"/></svg>Equilibrium Case Lab</span>
    <div class="tabs" role="tablist" aria-label="View">
      <button id="tab-cases" role="tab" data-act="view-cases" aria-pressed="true">Cases</button>
      <button id="tab-compare" role="tab" data-act="view-compare" aria-pressed="false">Compare and rules</button>
    </div>
    <div class="grp">
      <button id="b-undo" data-act="undo" disabled title="Undo (Ctrl/⌘ Z)">Undo</button>
      <button id="b-redo" data-act="redo" disabled title="Redo (Ctrl/⌘ Shift Z)">Redo</button>
    </div>
    <div class="grp">
      <button data-act="export-sheet-png" title="The current case as one figure">Case sheet PNG</button>
      <button data-act="export-sheet-svg">SVG</button>
      <button data-act="export-json">JSON</button>
      <label class="btn" title="Load cases exported as JSON"><input id="f-import" type="file" accept="application/json,.json" hidden>Import</label>
    </div>
    <span id="status" class="status">Saved version</span>
    <button id="b-save" class="primary" data-act="save" disabled title="Saving works on the published page">Save version</button>
  </header>
  <main>
    <aside class="side" aria-label="Cases">
      <h2><span>Cases</span><span id="ccount" class="mono">0 / 10</span></h2>
      <div class="clist" id="clist"></div>
      <button id="b-add" data-act="add-case">Add case</button>
    </aside>
    <section class="view" id="view"></section>
  </main>

  <div class="ed" id="ed" hidden role="dialog" aria-modal="true" aria-labelledby="ed-title">
    <div class="ed-bar">
      <div class="ed-title" id="ed-title">Form diagram</div>
      <div class="grp">
        <button id="e-undo" data-ed="undo" disabled>Undo</button>
        <button id="e-redo" data-ed="redo" disabled>Redo</button>
      </div>
      <div class="legend-k" aria-hidden="true"><span><i style="background:#2f6fd6"></i>Compression</span><span><i style="background:#c8323a"></i>Tension</span><span><i style="background:#22a05a"></i>Load</span></div>
      <span style="margin-left:auto"></span>
      <button data-ed="cancel">Cancel</button>
      <button class="primary" data-ed="done">Done</button>
    </div>
    <div class="ed-body">
      <div class="tools" id="tools" role="toolbar" aria-label="Drawing tools"></div>
      <div class="board-wrap">
        <svg id="edc" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid meet" aria-label="Drawing board"></svg>
        <div class="ed-hint" id="ed-hint"></div>
      </div>
      <div class="ed-side" id="ed-side"></div>
    </div>
  </div>

  cmds: {first: '', ib: '', mat: {material: '', section: '', skin: ''}}, intent: Object.fromEntries(INTENT.map(([k]) => [k, '']))});
const curCase = () => state.cases.find(c => c.id === curId) || null;
const imgSrc = im => im ? (im.asset ? '/_blob/' + im.asset : im.src) : null;
const safeSrc = s => (s && (s.startsWith('data:image/') || s.startsWith('/_blob/') || s.startsWith('blob:'))) ? s : '';
let toastT = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3800); }
const hasDrawing = d => d && ((d.members && d.members.length) || (d.nodes && d.nodes.length) || d.img);

// ---------- diagram drawing (shared by thumbnails, board, export) ----------
function bounds(d) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (x, y) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); };
  (d.nodes || []).forEach(n => { add(n.x, n.y); if (n.sup) add(n.x, n.y + 22); });
  const byN = Object.fromEntries((d.nodes || []).map(n => [n.id, n]));
  (d.loads || []).forEach(l => { const n = byN[l.n]; if (n) add(n.x - l.fx * LS, n.y - l.fy * LS); });
  if (d.img) { add(d.img.x, d.img.y); add(d.img.x + d.img.w, d.img.y + d.img.h); }
  if (x0 === Infinity) return {x: 0, y: 0, w: 800, h: 600};
  return {x: x0, y: y0, w: Math.max(1, x1 - x0), h: Math.max(1, y1 - y0)};
}
function supportGlyph(n) {
  if (n.sup === 'pin') return `<path d="M${n.x},${n.y + 3} l-9,14 h18 Z" fill="#5b636e"/><path d="M${n.x - 13},${n.y + 19} h26" stroke="#5b636e" stroke-width="2"/>`;
  if (n.sup === 'roller') return `<path d="M${n.x},${n.y + 3} l-9,12 h18 Z" fill="#5b636e"/><circle cx="${n.x - 5}" cy="${n.y + 19}" r="3" fill="#5b636e"/><circle cx="${n.x + 5}" cy="${n.y + 19}" r="3" fill="#5b636e"/>`;
  return '';
}
function diagramMarkup(d, opt = {}) {
  const byN = Object.fromEntries((d.nodes || []).map(n => [n.id, n]));
  const k = opt.k || 1; // stroke scale for thumbnails
  let s = '';
  const src = opt.srcOverride !== undefined ? opt.srcOverride : safeSrc(imgSrc(d.img));
  if (d.img && src) s += `<image href="${esc(src)}" x="${r1(d.img.x)}" y="${r1(d.img.y)}" width="${r1(d.img.w)}" height="${r1(d.img.h)}" opacity="${d.img.op ?? 1}" preserveAspectRatio="xMidYMid meet"${opt.live ? ' data-img="1"' : ''}/>`;
  (d.members || []).forEach(m => {
    const a = byN[m.a], b = byN[m.b]; if (!a || !b) return;
    const w = (m.k === 'u' ? 2.4 : 3.6) * k;
    s += `<line x1="${r1(a.x)}" y1="${r1(a.y)}" x2="${r1(b.x)}" y2="${r1(b.y)}" stroke="${COL[m.k] || COL.u}" stroke-width="${w}" stroke-linecap="round"${m.k === 'u' ? ` stroke-dasharray="${6 * k} ${5 * k}"` : ''}/>`;
    if (opt.live) s += `<line class="hit" data-m="${m.id}" x1="${r1(a.x)}" y1="${r1(a.y)}" x2="${r1(b.x)}" y2="${r1(b.y)}"/>`;
  });
  (d.loads || []).forEach(l => {
    const n = byN[l.n]; if (!n) return;
    const tx = n.x - l.fx * LS, ty = n.y - l.fy * LS, L = Math.hypot(n.x - tx, n.y - ty) || 1, ux = (n.x - tx) / L, uy = (n.y - ty) / L;
    const hx = n.x - ux * 6, hy = n.y - uy * 6, bx = hx - ux * 11, by = hy - uy * 11;
    s += `<line x1="${r1(tx)}" y1="${r1(ty)}" x2="${r1(bx)}" y2="${r1(by)}" stroke="${COL.l}" stroke-width="${2.6 * k}"/><path d="M${r1(hx)},${r1(hy)} L${r1(bx - uy * 6)},${r1(by + ux * 6)} L${r1(bx + uy * 6)},${r1(by - ux * 6)} Z" fill="${COL.l}"/>`;
    if (opt.live) s += `<circle class="handle" data-lt="${l.id}" cx="${r1(tx)}" cy="${r1(ty)}" r="7"/><line class="hit" data-l="${l.id}" x1="${r1(tx)}" y1="${r1(ty)}" x2="${r1(n.x)}" y2="${r1(n.y)}"/>`;
  });
  (d.nodes || []).forEach(n => {
    s += supportGlyph(n);
    s += `<circle cx="${r1(n.x)}" cy="${r1(n.y)}" r="${4.2 * k}" fill="#ffffff" stroke="#2a2e33" stroke-width="${1.6 * k}"${opt.live ? ` data-n="${n.id}"` : ''}/>`;
  });
  return s;
}
function thumbSVG(d, w = 400, h = 300) {
  const b = bounds(d), pad = Math.max(24, Math.max(b.w, b.h) * 0.08);
  let vx = b.x - pad, vy = b.y - pad, vw = b.w + pad * 2, vh = b.h + pad * 2;
  const ar = w / h; if (vw / vh > ar) { const nh = vw / ar; vy -= (nh - vh) / 2; vh = nh; } else { const nw = vh * ar; vx -= (nw - vw) / 2; vw = nw; }
  const k = Math.max(1, vw / 600);
  return `<svg viewBox="${r1(vx)} ${r1(vy)} ${r1(vw)} ${r1(vh)}" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><rect x="${r1(vx)}" y="${r1(vy)}" width="${r1(vw)}" height="${r1(vh)}" fill="#ffffff"/>${diagramMarkup(d, {k})}</svg>`;
}
function dominant(d) {
  if (!d || !d.members) return null;
  const byN = Object.fromEntries(d.nodes.map(n => [n.id, n]));
  let c = 0, t = 0;
  d.members.forEach(m => { const a = byN[m.a], b = byN[m.b]; if (!a || !b) return; const L = Math.hypot(b.x - a.x, b.y - a.y); if (m.k === 'c') c += L; else if (m.k === 't') t += L; });
  if (!c && !t) return null;
  return c > t * 1.25 ? 'compression' : t > c * 1.25 ? 'tension' : 'mixed';
}
function checkBadge(d) {
  if (!d || !d.check) return '';
  const s = d.check.status, mm = d.check.mismatches || 0;
  if (s === 'balanced' && !mm) return '<span class="badge ok">Balanced</span>';
  if (s === 'indeterminate' && !mm) return '<span class="badge mid">Balanced, redundant</span>';
  if (s === 'unbalanced') return '<span class="badge bad">Not balanced</span>';
  if (mm) return `<span class="badge bad">${mm} colour${mm > 1 ? 's' : ''} disagree</span>`;
  return '';
}

// ---------- history and saving ----------
const snapshot = () => JSON.stringify({cases: state.cases, rules: state.rules});
function pushHistory(s) { undoS.push(s); if (undoS.length > 60) undoS.shift(); redoS.length = 0; histUI(); }
function edit(key, fn) { const now = Date.now(); if (!(key && key === lastKey && now - lastT < 1500)) pushHistory(snapshot()); lastKey = key; lastT = now; fn(); markDirty(); }
function restore(s) { const o = JSON.parse(s); state.cases = o.cases; state.rules = o.rules; if (!curCase()) curId = (state.cases[0] || {}).id || null; render(); markDirty(); }
function undo() { if (!undoS.length) return; redoS.push(snapshot()); restore(undoS.pop()); lastKey = null; histUI(); }
function redo() { if (!redoS.length) return; undoS.push(snapshot()); restore(redoS.pop()); lastKey = null; histUI(); }
function histUI() { $('b-undo').disabled = !undoS.length; $('b-redo').disabled = !redoS.length; }
let draftT = 0;
function markDirty() {
  dirty = true; statusUI();
  clearTimeout(draftT);
  draftT = setTimeout(() => { try { localStorage.setItem(DKEY, JSON.stringify({base: baseKey, state})); } catch (e) { /* draft not kept */ } }, 700);
}
function statusUI(text) {
  const el = $('status'); el.classList.toggle('dirty', dirty && !text);
  el.textContent = text || (readOnly ? 'Read-only view' : dirty ? (window.claude ? 'Unsaved changes' : 'Your edits (kept in this browser)') : (state.savedAt ? 'Saved version' : 'Starting examples'));
}
function capsUI() {
  const b = $('b-save');

  if (readOnly) { b.disabled = true; b.title = 'You can view this page but not save it. Export JSON to keep your edits.'; }
  else if (CAP.artifact) { b.disabled = false; b.title = 'Save every case, drawing and rule as a new version of this page'; }
  else { b.disabled = true; b.title = CAP.artifact === undefined ? 'Connecting…' : 'Saving works on the published page'; }
}
function buildDocument(st) {
  const json = JSON.stringify(st).replace(/</g, '\\u003c');

    + SRC.pre + '<style id="css">' + SRC.css + '</style>' + SRC.shell
    + '<script type="application/json" id="lab-data">' + json + SC + '<script id="app">' + SRC.app + SC + '</body></html>';

async function save() {
  const art = CAP.artifact; if (!art || readOnly) return;
  const st = clone(state); st.savedAt = new Date().toISOString();
  $('b-save').disabled = true; statusUI('Saving…');
  try {

    else if (c === 'too_large') toast('The page is too large to save. Use smaller images.');
    else if (c === 'rate_limited') toast('Saving too often. Wait a moment, then save again.');

}

// ---------- images ----------
const toDataURL = blob => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
async function prepImage(file, max) {
  if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) throw new Error('type');
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const blob = await new Promise(res => c.toBlob(res, file.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.86));
  return {blob, w: c.width, h: c.height};
}
async function storeImage(file) {
  const assets = CAP.assets;
  const {blob, w, h} = await prepImage(file, assets ? 1600 : 1000);
  if (assets) { try { const r = await assets.upload(blob); return {asset: r.id, iw: w, ih: h}; } catch (err) { if (err && err.code === 'too_large') throw new Error('large'); } }
  return {src: await toDataURL(blob), iw: w, ih: h};
}
const imgError = err => err && err.message === 'type' ? 'Use a PNG, JPG, WebP or GIF image.' : err && err.message === 'large' ? 'That image is too large. Try a smaller one.' : 'This image could not be read. Save it as PNG or JPG and try again.';

// ---------- compare and rules ----------
function cmdTokens(c) { const s = (c.cmds.first + ' ' + c.cmds.ib).toLowerCase(); return CMD_WORDS.filter(w => new RegExp('\\b' + w).test(s)); }
function matTokens(c) { const s = Object.values(c.cmds.mat).join(' ').toLowerCase(); return MAT_WORDS.filter(w => new RegExp('\\b' + w).test(s)); }
function shared(a, b) {
  const out = [];
  if (a.proto === b.proto) out.push({k: 'prototype', text: `Same prototype: ${PNAME[a.proto]}`});
  if (DUAL[a.proto] === b.proto) out.push({k: 'duality', text: `Mirror prototypes: ${PNAME[a.proto]} ↔ ${PNAME[b.proto]}`});
  const da = dominant(a.stages.proto.form), db = dominant(b.stages.proto.form);
  const ct = cmdTokens(a).filter(w => cmdTokens(b).includes(w));
  ct.forEach(w => out.push({k: 'command', text: `Both use “${w}”`}));
  if (da && db && da !== db && da !== 'mixed' && db !== 'mixed') out.push({k: 'duality', text: `Opposite force: ${a.name} is ${da}-led, ${b.name} is ${db}-led`});
  matTokens(a).filter(w => matTokens(b).includes(w)).forEach(w => out.push({k: 'material', text: `Both materialised in ${w}`}));
  if (a.intent.function && a.intent.function.trim().toLowerCase() === (b.intent.function || '').trim().toLowerCase()) out.push({k: 'intent', text: `Same function: ${a.intent.function}`});
  return out;
}
function relationships() {
  const cs = state.cases, rel = [];
  const groupBy = (keyFn, kind, label) => {
    const g = {}; cs.forEach(c => keyFn(c).forEach(k => { (g[k] = g[k] || []).push(c); }));
    Object.entries(g).forEach(([k, list]) => { if (list.length > 1) rel.push({kind, text: label(k, list), cases: list.map(c => c.id)}); });
  };
  groupBy(c => [c.proto], 'Shared prototype', (k, l) => `${PNAME[k]} is the prototype of ${l.map(c => c.name).join(', ')}.`);
  groupBy(c => cmdTokens(c), 'Shared command', (k, l) => `“${k}” is a transformation step in ${l.map(c => c.name).join(', ')}.`);
  for (let i = 0; i < cs.length; i++) for (let j = i + 1; j < cs.length; j++) {
    const a = cs[i], b = cs[j], da = dominant(a.stages.proto.form), db = dominant(b.stages.proto.form);
    if (DUAL[a.proto] === b.proto) rel.push({kind: 'Mirror prototypes', text: `${a.name} starts from ${PNAME[a.proto].toLowerCase()} and ${b.name} from ${PNAME[b.proto].toLowerCase()}, its mirror: inverting one gives the other, with compression and tension swapped.`, cases: [a.id, b.id]});
    else if (da && db && da !== db && da !== 'mixed' && db !== 'mixed') { const sh = cmdTokens(a).filter(w => cmdTokens(b).includes(w)); if (sh.length) rel.push({kind: 'Compression–tension pair', text: `${a.name} is ${da}-led and ${b.name} is ${db}-led, and both use “${sh.join('”, “')}”.`, cases: [a.id, b.id]}); }
  }
  groupBy(c => matTokens(c), 'Shared material', (k, l) => `${l.map(c => c.name).join(', ')} are materialised in ${k}.`);
  return rel;
}
function stageState(c, k) {
  const f = c.stages[k].form, ch = f && f.check;
  if (ch) return (ch.status === 'unbalanced' || ch.mismatches) ? 'bad' : 'ok';
  return (hasDrawing(f) || (k === 'built' && c.stages[k].photo)) ? 'on' : '';
}
function renderCompare() {
  const cs = state.cases;
  const rels = relationships();
  const N = cs.length;
  const sharedM = cs.map(a => cs.map(b => a === b ? null : shared(a, b)));
  const maxS = Math.max(1, ...sharedM.flat().filter(Boolean).map(s => s.length));
  const pairInfo = pairSel && cs[pairSel[0]] && cs[pairSel[1]] ? {a: cs[pairSel[0]], b: cs[pairSel[1]], s: sharedM[pairSel[0]][pairSel[1]]} : null;
  $('view').innerHTML = `
  <div class="card">
    <div class="kicker">Compare ${N} case${N === 1 ? '' : 's'}</div>
    <h2>What the cases share, step by step</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>Case</th><th>Prototype</th><th>Force in 2D prototype</th><th>First command</th><th>Second command</th><th>Materialize</th><th>Stages</th></tr></thead>
      <tbody>${cs.map(c => { const dm = dominant(c.stages.proto.form); return `<tr>

  if (inFrame) { toast(CAP.downloads === undefined ? 'Still connecting. Try again in a moment.' : 'Downloads are not available in this view.'); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
}

}

}
$('ed-side').addEventListener('click', ev => {
  const b = ev.target.closest('[data-es],[data-cmd]'); if (!b || b.tagName === 'INPUT' || b.tagName === 'SELECT' || b.tagName === 'LABEL') return;
  if (b.dataset.cmd) return runCmd(b.dataset.cmd);
  const a = b.dataset.es;
  if (a === 'check') runCheck();
  else if (a === 'colours') applyColours();
  else if (a === 'del') delSel();
  else if (a === 'addload') { const n = ED.d.nodes.find(x => x.id === ED.sel.id); if (n) { edPush(); const l = {id: uid('l'), n: n.id, fx: 0, fy: 1}; ED.d.loads.push(l); ED.sel = {t: 'l', id: l.id}; drawBoard(); renderEdSide(); } }
  else if (a === 'imgdel') { edPush(); ED.d.img = null; drawBoard(); renderEdSide(); }
  else if (a === 'imgfit') { edPush(); fitImage(ED.d.img); drawBoard(); renderEdSide(); }
  else if (a === 'copyprev') { const pk = STAGES[STAGES.findIndex(s => s[0] === ED.key) - 1][0]; edPush(); ED.d = clone(ED.c.stages[pk][ED.which]); ED.d.check = null; ED.check = null; ED.sel = null; drawBoard(); renderEdSide(); toast('Copied. Now apply a command or redraw.'); }
});
let edInputT = 0;
$('ed-side').addEventListener('input', ev => {
  const t = ev.target, a = t.dataset.es; if (!a) return;
  if (a === 'op' || a === 'sz') {
    if (!ED.d.img) return;
    if (Date.now() - edInputT > 1200) edPush(); edInputT = Date.now();
    if (a === 'op') ED.d.img.op = +t.value;
    else { const im = ED.d.img, cx = im.x + im.w / 2, cy = im.y + im.h / 2, k = +t.value, ar = im.h / im.w; im.w = 800 * k; im.h = im.w * ar; im.x = cx - im.w / 2; im.y = cy - im.h / 2; }
    drawBoard();
  }
});
$('ed-side').addEventListener('change', async ev => {
  const t = ev.target, a = t.dataset.es; if (!a) return;
  if (a === 'file') { const f = t.files && t.files[0]; t.value = ''; if (f) addBoardImage(f); return; }
  const s = ED.sel; if (!s) return;
  edPush();
  if (a === 'kind') { const m = ED.d.members.find(x => x.id === s.id); if (m) m.k = t.value; }
  if (a === 'sup') { const n = ED.d.nodes.find(x => x.id === s.id); if (n) n.sup = t.value || null; }
  if (a === 'mag' || a === 'ang') {
    const l = ED.d.loads.find(x => x.id === s.id); if (!l) return;
    const mag = a === 'mag' ? Math.max(0, +t.value) : Math.hypot(l.fx, l.fy), ang = (a === 'ang' ? +t.value : Math.atan2(l.fy, l.fx) * 180 / Math.PI) * Math.PI / 180;
    l.fx = Math.round(Math.cos(ang) * mag * 1000) / 1000; l.fy = Math.round(Math.sin(ang) * mag * 1000) / 1000;
  }
  drawBoard(); renderEdSide();
});
function fitImage(im) { if (!im) return; const ar = (im.ih || 3) / (im.iw || 4); let w = 760, h = w * ar; if (h > 560) { h = 560; w = h / ar; } im.w = w; im.h = h; im.x = 400 - w / 2; im.y = 300 - h / 2; }
async function addBoardImage(file) {
  try {
    statusUI('Adding image…');
    const st = await storeImage(file); edPush();
    ED.d.img = Object.assign({op: hasDrawing({...ED.d, img: null}) ? 0.45 : 1}, st); fitImage(ED.d.img);
    drawBoard(); renderEdSide(); toast('Image added. Draw over it, or keep it as the diagram.');
  } catch (err) { toast(imgError(err)); }
  statusUI();
}
const boardWrap = document.querySelector('.board-wrap');
boardWrap.addEventListener('dragover', ev => { if (ev.dataTransfer && [...ev.dataTransfer.types].includes('Files')) ev.preventDefault(); });
boardWrap.addEventListener('drop', ev => { ev.preventDefault(); const f = ev.dataTransfer && [...ev.dataTransfer.files].find(x => x.type.startsWith('image/')); if (f) addBoardImage(f); });
document.addEventListener('paste', ev => {
  if ($('ed').hidden) return;
  const f = ev.clipboardData && [...ev.clipboardData.files].find(x => x.type.startsWith('image/'));
  if (f) { ev.preventDefault(); addBoardImage(f); }
});
$('ed').querySelector('.ed-bar').addEventListener('click', ev => {
  const b = ev.target.closest('[data-ed]'); if (!b) return;
  const a = b.dataset.ed;
  if (a === 'done') closeEditor(true);
  else if (a === 'cancel') closeEditor(false);
  else if (a === 'undo') edUndo();
  else if (a === 'redo') edRedo();
});

// ---------- GitHub copy: the shared cases live in cases.json next to the page ----------
async function loadRepoCases() {
  if (window.claude) return;
  let g; try { const r = await fetch('cases.json', {cache: 'no-store'}); if (!r.ok) return; g = await r.json(); } catch (e) { return; }
  if (!g || !Array.isArray(g.cases)) return;
  baseKey = 'repo:' + (g.savedAt || ''); let next = g, rest = false;
  try { const d = JSON.parse(localStorage.getItem(DKEY) || 'null'); if (d && d.base === baseKey && d.state && Array.isArray(d.state.cases)) { next = d.state; rest = true; } } catch (e) { /* no draft */ }
  state = next; state.cases = state.cases.slice(0, MAXC); state.rules = state.rules || [];
  dirty = rest; undoS.length = 0; redoS.length = 0; histUI();
  curId = (state.cases[0] || {}).id || null; render(); statusUI();
  if (rest) toast('Restored your unsaved edits from this browser.');
}

// ---------- start ----------
histUI(); capsUI(); render(); statusUI(); loadRepoCases();
if (restored) toast('Restored your unsaved edits from this browser.');
})();
</script>
