<style id="css">
/* Layout: full-height editor. Toolbar band on top; a white artboard (the print figure, paper-white in both themes) on a workspace canvas; inspector column on the right that stacks under the canvas on phones. */
:root {
  --bg: #e8ebef;
  --surface: #ffffff;
  --surface-2: #f3f5f7;
  --ink: #1a1e23;
  --ink-2: #59626e;
  --line: #d5dae0;
  --accent: #5a44c8;
  --accent-soft: #ece9fb;
  --danger: #b4232c;
  --warn: #c7771f;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121519; --surface: #1b1f25; --surface-2: #242a32; --ink: #e5e8ec; --ink-2: #9aa3ae; --line: #303740;
    --accent: #a594ff; --accent-soft: #2a2647; --danger: #ff7c83; --warn: #f0a24e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121519; --surface: #1b1f25; --surface-2: #242a32; --ink: #e5e8ec; --ink-2: #9aa3ae; --line: #303740;
  --accent: #a594ff; --accent-soft: #2a2647; --danger: #ff7c83; --warn: #f0a24e; color-scheme: dark;
}
[hidden] { display: none !important; }
html { box-sizing: border-box; height: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; }
#root { height: 100%; display: flex; flex-direction: column; }
.bar { background: var(--surface); border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.brand { font-weight: 600; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; margin-right: 4px; }
.grp { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.grp-label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); margin-right: 2px; }
.sep { width: 1px; align-self: stretch; background: var(--line); }
button, .btn { font: inherit; font-size: 13px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; min-height: 30px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.2; white-space: nowrap; }
button:hover, .btn:hover { border-color: var(--ink-2); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .btn:focus-within { outline: 2px solid var(--accent); outline-offset: 1px; }
button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
button.primary { background: var(--ink); border-color: var(--ink); color: var(--surface); font-weight: 600; }
button.danger { color: var(--danger); }
button:disabled { opacity: .45; cursor: not-allowed; }
kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface-2); }
.status { margin-left: auto; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.status.dirty::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 340px; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }

.ov { pointer-events: none; }

.ov .sel-e { fill: none; stroke: var(--accent); stroke-width: 3; stroke-dasharray: 9 6; }

aside.panel { background: var(--surface); border-left: 1px solid var(--line); overflow-y: auto; min-width: 0; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 24px 16px; display: flex; flex-direction: column; gap: 18px; }

.field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
.field > span.v { font-family: var(--f-mono); color: var(--ink); }
.field .lab { display: flex; justify-content: space-between; gap: 8px; }
input[type="text"], input[type="number"], select, textarea { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; min-width: 0; }
textarea { resize: vertical; line-height: 1.35; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
.mono { font-family: var(--f-mono); }
.chk { display: flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--ink); cursor: pointer; }
.chk input { accent-color: var(--accent); width: 16px; height: 16px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.list { display: flex; flex-direction: column; gap: 4px; }
.list button { justify-content: flex-start; text-align: left; white-space: normal; font-size: 13px; }
.list .cmd { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); }
.thumb { width: 112px; height: 112px; border-radius: 50%; border: 2px solid var(--line); overflow: hidden; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-2); font-size: 12px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; max-width: none; }
.imgrow { display: flex; gap: 14px; align-items: center; }
.imgrow .btnrow { flex-direction: column; align-items: flex-start; }
.note { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; margin: 0; }
.meta { font-size: 13px; color: var(--ink-2); margin: 0; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0; }
.stats div { background: var(--surface-2); border-radius: 6px; padding: 8px 10px; }

.tcol { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

/* form and force diagram tiles in the side panel */
.dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { position: relative; border: 1px solid var(--line); border-radius: 8px; background: #ffffff; aspect-ratio: 4 / 3; overflow: hidden; max-width: 100%; }
.tile > svg, .tile > img { width: 100%; height: 100%; display: block; object-fit: cover; }
.tile .tlabel { position: absolute; left: 8px; top: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: #5a6370; font-weight: 600; background: rgba(255, 255, 255, .85); padding: 1px 5px; border-radius: 4px; pointer-events: none; }
.tile .badge { position: absolute; right: 6px; top: 6px; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; pointer-events: none; }
.badge.ok { background: #e3f4ea; color: #1e7a4c; }
.badge.bad { background: #fbeedd; color: #9a5608; }
.badge.mid { background: #eef0f3; color: #4c5561; }
.tile .open { position: absolute; inset: 0; border: 0; background: transparent; border-radius: 0; cursor: pointer; }
.tile .open:hover { background: rgba(90, 68, 200, .06); }
.tile .empty { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center; padding: 10px; text-align: center; }
.tile .empty p { margin: 0; color: #5a6370; font-size: 12.5px; }
.tile .empty button { background: #f3f5f8; color: #1a1e24; border-color: #d4d9e0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
/* drawing board */
.ed { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

.ed-hint { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--surface); font-size: 12.5px; padding: 6px 12px; border-radius: 999px; pointer-events: none; max-width: calc(100% - 40px); text-align: center; }
.ed-side { background: var(--surface); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px max(14px, env(safe-area-inset-right, 0px)) 24px 14px; display: flex; flex-direction: column; gap: 16px; }
.ed-side .sec { display: flex; flex-direction: column; gap: 8px; }
.ed-side .sec + .sec { border-top: 1px solid var(--line); padding-top: 14px; }
.ed-side h3 { font-size: 12px; margin: 0; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); font-weight: 600; }
.cmdgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

.inline { display: grid; grid-template-columns: minmax(0, 1fr) 72px; gap: 6px; align-items: center; }
.result { border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.45; }

.flist { font-family: var(--f-mono); font-size: 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; }
.legend-k { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--ink-2); }
.legend-k span { display: inline-flex; align-items: center; gap: 5px; }

.ov .hl { fill: none; stroke-width: 12; stroke-opacity: .32; stroke-linecap: round; }
.ftg { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 18px; padding: 0 5px; border-radius: 4px; font: 700 11px/1 var(--f-mono); color: #fff; flex: none; }
.ftg.int { background: #fff !important; color: #111; border: 1.5px solid #111; }
.fnlist { display: flex; flex-direction: column; gap: 4px; }
.fnlist button { justify-content: flex-start; text-align: left; white-space: normal; gap: 8px; font-size: 13px; min-height: 32px; }
.fnlist button[aria-pressed="true"] { font-weight: 400; color: var(--ink); }
.fnlist .sig { font-family: var(--f-mono); font-size: 12px; overflow-wrap: anywhere; flex: 1; min-width: 0; }

// 2D pin-jointed equilibrium. Tension positive. Loads are force vectors at nodes (screen axes: y down).
// Drawn diagrams are never exact, so a node counts as balanced when what is left over is under 2% of the largest load.

    const e = par.edge; edit(null, () => { e.l = (!e.l || e.l === 'command') ? label : `${e.l} + ${label}`; }); renderEdges();
    toast(`Applied “${label}” and wrote it on the link from ${nodeName(par.node)}.`);
  } else toast(`Applied “${label}”.`);
}
function runCheck() {
  const res = solveDiagram(ED.d);
  if (res.status === 'empty') { toast('Draw members first.'); return; }
  ED.check = res; ED.d.check = {status: res.status, mismatches: res.mismatches.length, at: new Date().toISOString()};
  drawBoard(); renderEdSide();
}
function applyColours() {
  if (!ED.check || !ED.check.forces) return; edPush(); const f = ED.check.forces;
  ED.d.members.forEach(m => { if (m.id in f && m.k !== 'l') m.k = f[m.id] < 0 ? 'c' : f[m.id] > 0 ? 't' : 'u'; });
  ED.check = solveDiagram(ED.d); ED.d.check = {status: ED.check.status, mismatches: ED.check.mismatches.length, at: new Date().toISOString()};
  drawBoard(); renderEdSide(); toast('Member colours now follow the computed forces.');
}
function renderEdSide() {
  const d = ED.d; if (!d) return;
  const isForm = ED.which === 'form', ch = ED.check;
  const nN = d.nodes.length, nM = d.members.filter(m => m.k !== 'l').length, nL = d.loads.length, nS = d.nodes.filter(n => n.sup).length;
  let sel = '';
  if (ED.sel && ED.sel.t === 'm') { const m = d.members.find(x => x.id === ED.sel.id); if (m) sel = `<div class="sec"><h3>Selected member</h3><label class="field">Kind<select id="s-kind" data-es="kind">${[['c', 'Compression (blue)'], ['t', 'Tension (red)'], ['u', 'Undecided (grey)'], ['l', 'Load line (green)']].map(([v, l]) => `<option value="${v}"${v === m.k ? ' selected' : ''}>${l}</option>`).join('')}</select></label><div class="row"><button class="danger" data-es="del">Remove member</button></div></div>`; }
  if (ED.sel && ED.sel.t === 'l') { const l = d.loads.find(x => x.id === ED.sel.id); if (l) { const mag = Math.hypot(l.fx, l.fy), ang = Math.round(Math.atan2(l.fy, l.fx) * 180 / Math.PI); sel = `<div class="sec"><h3>Selected load</h3><div class="row2" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><label class="field">Size<input type="number" id="s-mag" data-es="mag" step="0.1" min="0" value="${mag.toFixed(2)}"></label><label class="field">Direction °<input type="number" id="s-ang" data-es="ang" step="15" value="${ang}"></label></div><p class="note">90° points straight down, 0° points right. One unit of force is ${LS} grid units of arrow.</p><div class="row"><button class="danger" data-es="del">Remove load</button></div></div>`; } }
  if (ED.sel && ED.sel.t === 'n') { const n = d.nodes.find(x => x.id === ED.sel.id); if (n) sel = `<div class="sec"><h3>Selected node</h3><label class="field">Support<select id="s-sup" data-es="sup">${[['', 'None'], ['pin', 'Pin (holds both ways)'], ['roller', 'Roller (holds vertically)']].map(([v, l]) => `<option value="${v}"${(n.sup || '') === v ? ' selected' : ''}>${l}</option>`).join('')}</select></label><div class="row"><button data-es="addload">Add load here</button><button class="danger" data-es="del">Remove node</button></div></div>`; }
  let chk = '';
  if (isForm) {
    let res = '<p class="note">Solves the force in every member from the loads and supports, and compares each result with the colour you drew.</p>';
    if (ch) {
      const mm = ch.mismatches.length;
      if (ch.status === 'unbalanced') res = `<div class="result bad"><b>Not in equilibrium</b>The loads cannot be balanced by these members and supports. The highlighted nodes are where force is left over. Add a member or a support, or move nodes so the shape follows the loads.</div>`;
      else {
        const head = ch.status === 'balanced' ? (ch.equations > ch.unknowns ? 'In equilibrium (the shape follows the loads)' : 'In equilibrium (statically determinate)') : `In equilibrium, with ${ch.redundant} redundant force${ch.redundant > 1 ? 's' : ''}`;
        const body = ch.status === 'indeterminate' ? 'More members than needed, so forces are not unique. The values shown are one balanced set without prestress.' : 'Every member force is fixed by the loads.';
        res = `<div class="result ${mm ? 'bad' : 'ok'}"><b>${head}</b>${body}${mm ? `<br><br><b>${mm} member colour${mm > 1 ? 's' : ''} disagree${mm > 1 ? '' : 's'} with the result</b>They are dashed in orange. A blue member came out in tension, or a red one in compression.` : '<br>Every colour matches the computed force.'}</div>`;
      }
    }
    chk = `<div class="sec"><h3>Equilibrium check</h3>${res}<div class="row"><button class="primary" data-es="check">Check equilibrium</button>${ch && ch.forces && ch.status !== 'unbalanced' && ch.mismatches.length ? '<button data-es="colours">Use computed colours</button>' : ''}</div><p class="note">${nN} nodes, ${nM} members, ${nL} loads, ${nS} supports.</p></div>`;
  }
  const im = d.img;
  const imgSec = `<div class="sec"><h3>Image</h3><p class="note">Use a sketch, a scan or a figure as the diagram, or trace over it.</p><div class="row"><label class="btn"><input type="file" id="s-file" data-es="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>${im ? 'Replace image' : 'Add image'}</label>${im ? '<button data-es="imgfit">Fit to board</button><button class="danger" data-es="imgdel">Remove</button>' : ''}</div>${im ? `<label class="field">Opacity<input type="range" id="s-op" data-es="op" min="0.1" max="1" step="0.05" value="${im.op ?? 1}"></label><label class="field">Size<input type="range" id="s-sz" data-es="sz" min="0.2" max="2" step="0.02" value="${(im.w / 800).toFixed(2)}"></label>` : ''}<p class="note">You can also drop or paste an image onto the board.</p></div>`;
  const cmdSec = `<div class="sec"><h3>Transformation commands</h3><p class="note">Apply a command to the whole drawing. ${ED.which === 'form' && parentOf(ED.n) ? 'On a form diagram it is also written on the link coming into this circle.' : ''}</p><div class="cmdgrid">${Object.entries(CMDS).filter(([, v]) => v.input === undefined).map(([k, v]) => `<button data-cmd="${k}" title="${esc(v.note)}">${esc(v.label)}</button>`).join('')}</div>${Object.entries(CMDS).filter(([, v]) => v.input !== undefined).map(([k, v]) => `<div class="inline"><button data-cmd="${k}" title="${esc(v.note)}">${esc(v.label)}</button><input type="number" id="cmd-${k}" step="0.1" min="0.1" value="${v.input}" aria-label="${esc(v.label)} factor"></div>`).join('')}</div>`;
  const par = parentOf(ED.n);
  const copySec = par && hasDrawing(par.node[ED.which]) ? `<div class="sec"><h3>Start from the linked circle</h3><p class="note">Replace this drawing with the ${ED.which} diagram of ${esc(nodeName(par.node))}, which links into this circle, then apply a command.</p><div class="row"><button data-es="copyprev">Copy from ${esc(nodeName(par.node))}</button></div></div>` : '';
  $('ed-side').innerHTML = sel + chk + cmdSec + copySec + imgSec + `<div class="sec"><h3>Keys</h3><p class="note"><kbd>V</kbd> move · <kbd>C</kbd> compression · <kbd>T</kbd> tension · <kbd>L</kbd> load · <kbd>S</kbd> support · <kbd>E</kbd> erase · <kbd>Esc</kbd> stop drawing · <kbd>Delete</kbd> remove selection</p></div>`;
}
$('ed-side').addEventListener('click', ev => {
  const b = ev.target.closest('[data-es],[data-cmd]'); if (!b || b.tagName === 'INPUT' || b.tagName === 'SELECT' || b.tagName === 'LABEL') return;
  if (b.dataset.cmd) return runCmd(b.dataset.cmd);
  const a = b.dataset.es;
  if (a === 'check') runCheck();
  else if (a === 'colours') applyColours();
  else if (a === 'del') delSel();
  else if (a === 'addload') { const n = ED.d.nodes.find(x => x.id === ED.sel.id); if (n) { edPush(); const l = {id: uid('l'), n: n.id, fx: 0, fy: 1}; ED.d.loads.push(l); ED.sel = {t: 'l', id: l.id}; drawBoard(); renderEdSide(); } }
  else if (a === 'imgdel') { edPush(); ED.d.img = null; drawBoard(); renderEdSide(); }
  else if (a === 'imgfit') { edPush(); fitImage(ED.d.img); drawBoard(); renderEdSide(); }
  else if (a === 'copyprev') { const par = parentOf(ED.n); if (!par) return; edPush(); ED.d = clone(par.node[ED.which]); ED.d.check = null; ED.check = null; ED.sel = null; drawBoard(); renderEdSide(); toast('Copied. Now apply a command or redraw.'); }
});
let edInputT = 0;
$('ed-side').addEventListener('input', ev => {
  const t = ev.target, a = t.dataset.es; if (!a) return;
  if (a === 'op' || a === 'sz') {
    if (!ED.d.img) return;
    if (Date.now() - edInputT > 1200) edPush(); edInputT = Date.now();
    if (a === 'op') ED.d.img.op = +t.value;
    else { const im = ED.d.img, cx = im.x + im.w / 2, cy = im.y + im.h / 2, k = +t.value, ar = im.h / im.w; im.w = 800 * k; im.h = im.w * ar; im.x = cx - im.w / 2; im.y = cy - im.h / 2; }
    drawBoard();
  }
});
$('ed-side').addEventListener('change', async ev => {
  const t = ev.target, a = t.dataset.es; if (!a) return;
  if (a === 'file') { const f = t.files && t.files[0]; t.value = ''; if (f) addBoardImage(f); return; }
  const s = ED.sel; if (!s) return;
  edPush();
  if (a === 'kind') { const m = ED.d.members.find(x => x.id === s.id); if (m) m.k = t.value; }
  if (a === 'sup') { const n = ED.d.nodes.find(x => x.id === s.id); if (n) n.sup = t.value || null; }
  if (a === 'mag' || a === 'ang') {
    const l = ED.d.loads.find(x => x.id === s.id); if (!l) return;
    const mag = a === 'mag' ? Math.max(0, +t.value) : Math.hypot(l.fx, l.fy), ang = (a === 'ang' ? +t.value : Math.atan2(l.fy, l.fx) * 180 / Math.PI) * Math.PI / 180;
    l.fx = Math.round(Math.cos(ang) * mag * 1000) / 1000; l.fy = Math.round(Math.sin(ang) * mag * 1000) / 1000;
  }
  drawBoard(); renderEdSide();
});
function fitImage(im) { if (!im) return; const ar = (im.ih || 3) / (im.iw || 4); let w = 760, h = w * ar; if (h > 560) { h = 560; w = h / ar; } im.w = w; im.h = h; im.x = 400 - w / 2; im.y = 300 - h / 2; }
async function addBoardImage(file) {
  try {
    statusUI('Adding image…');
    let dims = {iw: 4, ih: 3}; try { const bmp = await createImageBitmap(file); dims = {iw: bmp.width, ih: bmp.height}; } catch (e) { /* keep default */ }
    const st = Object.assign(await storeImage(file), dims); edPush();
    ED.d.img = Object.assign({op: hasDrawing({...ED.d, img: null}) ? 0.45 : 1}, st); fitImage(ED.d.img);
    drawBoard(); renderEdSide(); toast('Image added. Draw over it, or keep it as the diagram.');
  } catch (err) { toast(imgError(err)); }
  statusUI();
}
const boardWrap = document.querySelector('.board-wrap');
boardWrap.addEventListener('dragover', ev => { if (ev.dataTransfer && [...ev.dataTransfer.types].includes('Files')) ev.preventDefault(); });
boardWrap.addEventListener('drop', ev => { ev.preventDefault(); const f = ev.dataTransfer && [...ev.dataTransfer.files].find(x => x.type.startsWith('image/')); if (f) addBoardImage(f); });
document.addEventListener('paste', ev => {
  if ($('ed').hidden) return;
  const f = ev.clipboardData && [...ev.clipboardData.files].find(x => x.type.startsWith('image/'));
  if (f) { ev.preventDefault(); addBoardImage(f); }
});
$('ed').querySelector('.ed-bar').addEventListener('click', ev => {
  const b = ev.target.closest('[data-ed]'); if (!b) return;
  const a = b.dataset.ed;
  if (a === 'done') closeBoard(true);
  else if (a === 'cancel') closeBoard(false);
  else if (a === 'undo') edUndo();
  else if (a === 'redo') edRedo();
});


// ---------- photos published next to the page (GitHub copy): photos/manifest.json ----------
async function loadManifest() {
  let m; try { const r = await fetch('photos/manifest.json', {cache: 'no-store'}); if (!r.ok) return; m = await r.json(); } catch (e) { return; }
  let k = 0;
  const put = (o, h) => { if (h && h.path && !o.img) { o.img = {src: h.path, z: 1, ox: 0, oy: 0, credit: {author: h.author, license: h.license, page: h.page, from: h.from}}; k++; } };
  state.nodes.forEach(n => { if (n.t !== 'case') return; put(n, m[n.name]); (n.alts || []).forEach(a => put(a, m[a.name])); });
  if (k) { renderAll(); }
}
if (!window.claude) { $('b-save').hidden = true; $('b-submit').hidden = false; }
// GitHub copy: the shared graph lives in knowledge-graph.json next to the page
async function loadRepoGraph() {
  if (window.claude) return;
  let g; try { const r = await fetch('knowledge-graph.json', {cache: 'no-store'}); if (!r.ok) return; g = await r.json(); } catch (e) { return; }
  if (!g || !Array.isArray(g.nodes) || !Array.isArray(g.edges)) return;
  baseKey = 'repo:' + (g.savedAt || ''); let next = g, rest = false;
  try { const d = JSON.parse(localStorage.getItem(DKEY) || 'null'); if (d && d.base === baseKey && d.state && Array.isArray(d.state.nodes)) { next = d.state; rest = true; } } catch (e) { /* no draft */ }
  state = normalize(next);
  dirty = rest; undoS.length = 0; redoS.length = 0; histUI(); sel = {nodes: new Set(), edge: null, legend: false, fn: null, call: null, fntable: false};
  renderAll(); fit(); statusUI();
  if (rest) toast('Restored your unsaved edits from this browser.');
}

// ---------- start ----------
histUI(); capsUI(); renderAll(); fit(); statusUI(); loadRepoGraph().then(loadManifest);
if (restored) toast('Restored your unsaved edits from this browser.');
})();
